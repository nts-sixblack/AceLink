name: Docker image (sixblack/acelink)

# Builds the Ace Stream engine image used by the Ace Link app.
#  - Pull requests: build only (never pushed).
#  - Push to master: pushed as sixblack/acelink:edge.
#  - Version tag (e.g. 2.2.0): pushed as sixblack/acelink:2.2.0 and :latest.
#    The app pulls sixblack/acelink:<app version>, so every release tag MUST have an image.
#
# Required repository settings:
#  - Secret   DOCKERHUB_TOKEN    : Docker Hub access token (Read & Write) for the account below.
#  - Variable DOCKERHUB_USERNAME : optional, defaults to "sixblack".

on:
  push:
    branches: [master]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
    paths-ignore: ["**.md", "Ace Link/**", "Ace Link.xcodeproj/**", "scripts/**"]
  pull_request:
    paths: ["Dockerfile", "player.html", "acestream.conf", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/sixblack/acelink

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'sixblack' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # linux/arm64 is not possible: Ace Stream ships no arm64 Linux binary.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
